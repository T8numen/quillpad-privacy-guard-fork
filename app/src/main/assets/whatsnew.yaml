# Add newest entries to the top.
# The launcher welcome screen and About -> Changelog both read this file.
# Future releases should add their notes here as part of the version bump.
updates:
  - id: 13
    version: 1.5.32
    title: 图片插入更稳定
    items:
      - 通过图片选择器插入 Markdown 图片时，会保持打开选择器时的插入位置，并改进复制取消处理。

  - id: 12
    version: 1.5.31
    title: 图片会保存到应用内
    items:
      - 通过图片选择器插入 Markdown 图片时，会先复制到应用私有目录，删除相册原图后笔记中仍可显示。

  - id: 11
    version: 1.5.29
    title: 编辑器工具栏可自定义
    items:
      - 设置页“其他”中新增“编辑底部工具栏”，可调整编辑器底部按钮顺序并隐藏不需要的工具。

  - id: 10
    version: 1.5.28
    title: 图片插入体验改进
    items:
      - 插入 Markdown 图片时可直接打开系统图片选择器，不再必须手动填写图像路径。
      - 设置页“其他”中新增图片插入默认方式，可在图片选择器和路径输入之间切换。

  - id: 9
    version: 1.5.14
    title: 默认中文与界面汉化
    items:
      - 应用首次启动时默认使用简体中文。
      - 新增的应用锁、莫奈主题、关于页更新日志等功能文案已补充中文翻译。
      - 欢迎页与应用内更新日志改为中文显示，减少英文内容回退。

  - id: 8
    version: 1.5.13
    title: 预测性返回、应用锁与莫奈预设
    items:
      - 已加入 Android 预测性返回支持，并将 Navigation 依赖升级到 2.9.4。
      - 新增 4 套莫奈风应用主题：睡莲、日出、花园、鸢尾。
      - 新增指纹应用锁；未解锁前会隐藏笔记、笔记本列表和笔记数量。
      - 关于页新增“更新日志”入口，从 1.5.13 开始可在应用内查看版本更新内容。
      - 修复欢迎页后的启动闪退，并移除了 debug 包里的 LeakCanary 桌面图标。

  - id: 7
    title: 新的配色方案选项
    items:
      - 为笔记新增更多颜色选项（蓝绿色、青色、紫色、棕色、灰色）。
      - 为应用新增两套主题（红色、黄色）。
      - 提升性能并修复若干问题。

  - id: 6
    title: 问题修复与翻译更新
    items:
      - 修复滑动任务时缩进应用不正确的问题。
      - 更新土耳其语翻译。

  - id: 5
    title: 问题修复与功能改进
    items:
      - 修复所有笔记可能被误移入回收站的问题。
      - 更新意大利语、德语、瑞典语、俄语、罗马尼亚语和中文翻译。
      - 新增默认编辑器模式设置（编辑或预览）。
      - 新任务会默认添加到列表顶部。
      - 创建空标题笔记时不再显示“未命名”。

  - id: 4
    title: 小组件来啦
    items:
      - 可以将小组件添加到桌面，快速访问已置顶的笔记和任务。
  - id: 3
    title: Quillpad 新变化
    items:
      - 可通过关于页中的“发送日志”选项快速反馈问题。
      - Nextcloud 同步相关错误提示更明确、更具体。
      - 修复远端删除和本地更新未正确同步到服务器的问题。
      - 更新法语、德语和俄语翻译。
  - id: 2
    title: 问题修复
    items:
      - 修复了一些已知问题。
